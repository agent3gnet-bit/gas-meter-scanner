name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip build-essential git python3-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            openjdk-17-jdk-headless zip unzip autoconf automake libtool libltdl-dev \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus libtesseract-dev

      - name: Install buildozer and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==3.0.11
          pip install kivy==2.3.0 kivymd==1.2.1 opencv-python==4.10.0.84 numpy==1.26.4 \
                      pandas==2.2.3 openpyxl==3.1.5 pillow==11.0.0 pytesseract==0.3.13 \
                      pyzxing==1.2.2 plyer==2.1.0

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
          echo "Building APK..."
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasMeterReader-APK
          path: dist/*.apk
          retention-days: 30
